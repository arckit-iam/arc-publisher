spring:
  application:
    name: arc-publisher

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arc_publisher}
    username: ${SPRING_DATASOURCE_USERNAME:arc}
    password: ${SPRING_DATASOURCE_PASSWORD:arc}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          # Clés publiques d'arc-auth, récupérées et mises en cache (aucun appel au démarrage).
          jwk-set-uri: ${ARC_SECURITY_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
          # Valeur attendue de iss : obligatoire, sans valeur par défaut. Avec jwk-set-uri, aucune découverte OIDC n'a lieu.
          issuer-uri: ${ARC_SECURITY_ISSUER_URI}
          audiences: ${ARC_SECURITY_AUDIENCE:arc}

arc:
  topics:
    provisioning:
      identity: ${ARC_TOPICS_PROVISIONING_IDENTITY:arc.provisioning.identity}
      assignment: ${ARC_TOPICS_PROVISIONING_ASSIGNMENT:arc.provisioning.assignment}
      entitlement: ${ARC_TOPICS_PROVISIONING_ENTITLEMENT:arc.provisioning.entitlement}

server:
  port: ${SERVER_PORT:8081}
