spring:
  application:
    name: arc-publisher

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arc_publisher}
    username: ${SPRING_DATASOURCE_USERNAME:arc}
    password: ${SPRING_DATASOURCE_PASSWORD:arc}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

arc:
  topics:
    provisioning: ${ARC_TOPICS_PROVISIONING:arc.provisioning}

server:
  port: ${SERVER_PORT:8081}
