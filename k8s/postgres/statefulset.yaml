---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arc-publisher-postgres
  namespace: default
spec:
  serviceName: arc-publisher-postgres
  replicas: 1
  selector:
    matchLabels:
      app: arc-publisher-postgres
  template:
    metadata:
      labels:
        app: arc-publisher-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: arc_publisher
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: arc-publisher-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arc-publisher-db-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "arc", "-d", "arc_publisher"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "arc", "-d", "arc_publisher"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: arc-publisher-postgres-pvc
        - name: init-sql
          configMap:
            name: arc-publisher-postgres-init
