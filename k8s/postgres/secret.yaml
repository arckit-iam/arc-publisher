---
# CE FICHIER N'EST PAS APPLIQUÉ DIRECTEMENT.
# Le secret est créé/mis à jour automatiquement par deploy.yml
# depuis le GitHub Secret "ARC_PUBLISHER_DB_PASSWORD".
#
# Pour créer manuellement (hors CI) :
#   kubectl create secret generic arc-publisher-db-secret \
#     --from-literal=username=arc \
#     --from-literal=password=MON_MOT_DE_PASSE
#
# Structure attendue :
#   - username: arc
#   - password: <défini dans GitHub Secrets → ARC_PUBLISHER_DB_PASSWORD>
