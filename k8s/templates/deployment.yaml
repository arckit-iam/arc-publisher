---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-publisher
  namespace: {{.Release.Namespace}}
spec:
  replicas: {{.Values.replicaCount}}
  selector:
    matchLabels:
      app: arc-publisher
  template:
    metadata:
      labels:
        app: arc-publisher
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: arc-publisher
          image: "{{.Values.image.repository}}:{{.Values.image.tag}}"
          imagePullPolicy: {{.Values.image.pullPolicy}}
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: arc-publisher-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arc-publisher-db-secret
                  key: password
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
