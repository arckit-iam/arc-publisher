---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-publisher-config
data:
  SPRING_DATASOURCE_URL: "{{ .Values.database.url }}"
  SPRING_DATASOURCE_USERNAME: "{{ .Values.database.username }}"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.kafka.bootstrapServers }}"
  ARC_TOPICS_PROVISIONING_IDENTITY: "{{.Values.arc.topics.provisioning.identity}}"
  ARC_TOPICS_PROVISIONING_ASSIGNMENT: "{{.Values.arc.topics.provisioning.assignment}}"
  ARC_TOPICS_PROVISIONING_ENTITLEMENT: "{{.Values.arc.topics.provisioning.entitlement}}"
  SERVER_PORT: "{{ .Values.server.port }}"
