---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-publisher
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s
      sourceRef:
        kind: GitRepository
        name: arcpublisher
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/arckit-iam/arc-publisher
      tag: "1.0.0-dev"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr
    kafka:
      bootstrapServers: "redpanda-external.arckit.svc.cluster.local:9092"
    database:
      url: "jdbc:postgresql://arc-publisher-postgres.default.svc.cluster.local:5432/arc_publisher"
      username: "arc"
    arc:
      topics:
        provisioning: "arc.provisioning"
