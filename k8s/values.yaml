---
imagePullSecrets:
  - name: ghcr
replicaCount: 1
image:
  repository: ghcr.io/arckit-iam/arc-publisher
  tag: 1.0.0-dev
  pullPolicy: Always

kafka:
  bootstrapServers: "redpanda-external.arckit.svc.cluster.local:9092"

database:
  url: "jdbc:postgresql://arc-publisher-postgres.default.svc.cluster.local:5432/arc_publisher"
  username: "arc"
  # Le mot de passe est dans le Secret Kubernetes "arc-publisher-db-secret" (clé: password)

arc:
  topics:
    provisioning:
      identity: "arc.provisioning.identity"
      assignment: "arc.provisioning.assignment"
      entitlement: "arc.provisioning.entitlement"

server:
  port: "8081"
