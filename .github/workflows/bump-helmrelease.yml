name: Bump HelmRelease tag

on:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout arc-kubeorchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arckit-iam/arc-kubeorchestrator
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Bump HelmRelease tag
        run: |
          sed -i "s/tag: \".*\"/tag: \"${{ steps.version.outputs.VERSION }}\"/" flux/arc-publisher/helmrelease.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          commit-message: "chore(gitops): bump arc-publisher HelmRelease tag to ${{ steps.version.outputs.VERSION }}"
          title: "chore(gitops): bump arc-publisher HelmRelease tag to ${{ steps.version.outputs.VERSION }}"
          body: "Automated PR to deploy arc-publisher version ${{ steps.version.outputs.VERSION }} via FluxCD."
          branch: bump-arc-publisher-${{ steps.version.outputs.VERSION }}
          base: main
